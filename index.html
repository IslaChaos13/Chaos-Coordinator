<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Coordinator</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">

</head>
<body id = mainBody>


    <h1><img src = "Images/Chaos.png" alt="Chaos">Chaos Coordinator</h1>

    <!-- Personal To Do List -->
<div id = 'lists'>
    <div class = "listBox">
        <h1>Personal</h1>
    <form>
        <input id = "inputTask" type = "text" placeholder = "Enter task">
        <button id = "listBtn" type="button" class="btn btn-secondary btn-sm">Add</button>
    <ul id = "mainList"></ul>
    </form>

</div>
<!-- Work To Do List -->
<div class = "listBox">
    <h1>Work</h1>
    <form>
        <input id = 'wInput' type = "text" placeholder = "Enter task">
        <button id = "wBtn" type ="button" class="btn btn-secondary btn-sm">Add</button>
        <ul id = "wList"></ul>
    </form>
</div>

<!-- School To Do List -->
 <div class = "listBox">
    <h1>School</h1>
    <form>
        <input id = 'sInput' type = "text" placeholder = "Enter task">
        <button id = "sBtn" type ="button" class="btn btn-secondary btn-sm">Add</button>
        <ul id = "sList"></ul>
    </form>
</div>

</div>
<!-- Completed Task -->
<div>
    <h3>Completed</h3>
    <ul id = "completedList"></ul>
</div>


<script src="./index.js"></script>

</body>
</html>
